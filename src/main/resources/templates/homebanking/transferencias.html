<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>BCP - Transferencias</title>
    <link rel="stylesheet" th:href="@{/css/homebanking.css}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="hb-body">
<nav class="hb-nav">
    <div class="hb-nav-logo"><span class="bcp-text">BCP</span><span class="orange-dot">></span></div>
    <div class="hb-nav-links">
        <a href="/homebanking/dashboard" class="hb-link">Inicio</a>
        <a href="/homebanking/cuentas" class="hb-link">Cuentas</a>
        <a href="/homebanking/transferencias" class="hb-link active">Transferencias</a>
        <a href="/homebanking/creditos" class="hb-link">Créditos</a>
    </div>
    <div class="hb-nav-user">
        <span class="user-greeting">Hola, <strong th:text="${cliente.nombreCompleto.split(' ')[0]}">Cliente</strong></span>
        <a href="/logout" class="btn-logout-hb">Salir</a>
    </div>
</nav>
<main class="hb-main">
    <div class="hb-welcome">
        <div><h1>Transferencias</h1><p>Envía dinero de forma rápida y segura</p></div>
    </div>
    <div th:if="${mensaje}" class="alert-hb success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert-hb error" th:text="${error}"></div>

    <section class="hb-section">
        <div class="form-transfer-container">
            <h2>Nueva Transferencia</h2>
            <div th:if="${#lists.isEmpty(cuentas)}" class="empty-state-hb">
                Necesitas al menos una cuenta activa para transferir.
                <a href="/homebanking/cuentas">Abrir cuenta</a>
            </div>
            <form th:unless="${#lists.isEmpty(cuentas)}"
                  th:action="@{/homebanking/transferencias/realizar}" method="post" class="form-hb">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group-hb">
                    <label>Cuenta Origen</label>
                    <select name="cuentaOrigenId" required>
                        <option th:each="c : ${cuentas}"
                                th:value="${c.id}"
                                th:text="${c.tipoCuenta} + ' - ' + ${c.numeroCuenta} + ' | Saldo: ' + ${c.moneda} + ' ' + ${#numbers.formatDecimal(c.saldo,1,'COMMA',2,'POINT')}">
                        </option>
                    </select>
                </div>
                <div class="form-group-hb">
                    <label>N° Cuenta Destino</label>
                    <input type="text" name="numeroCuentaDestino" placeholder="Ej: 191-00000001-01" required>
                </div>
                <div class="form-group-hb">
                    <label>Monto a Transferir (S/)</label>
                    <input type="number" name="monto" step="0.01" min="1" placeholder="0.00" required>
                </div>
                <div class="form-group-hb">
                    <label>Descripción (opcional)</label>
                    <input type="text" name="descripcion" placeholder="Ej: Pago de alquiler">
                </div>
                <button type="submit" class="btn-primary full-width">Transferir ahora</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
