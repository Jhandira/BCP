<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCP - Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: #e8f0f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 40px 24px;
        }
        .error-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 32px;
        }
        .bcp-text { font-size: 28px; font-weight: 900; color: #003087; letter-spacing: -1px; }
        .orange-dot { font-size: 32px; color: #f97316; font-weight: 900; }
        .error-code {
            font-size: 96px;
            font-weight: 900;
            color: #003087;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: #1a2e5a;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #f97316;
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-primary:hover { background: #ea6000; }
        .btn-outline {
            background: none;
            color: #003087;
            border: 2px solid #003087;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s, color .2s;
        }
        .btn-outline:hover { background: #003087; color: #fff; }
        .error-illustration { font-size: 80px; margin-bottom: 24px; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-logo">
        <span class="bcp-text">BCP</span><span class="orange-dot">></span>
    </div>

    <div class="error-illustration"
         th:text="${status == 404} ? '🔍' :
                      (${status == 403} ? '🔒' : '⚠️')">⚠️</div>

    <div class="error-code" th:text="${status}">Error</div>

    <h1 class="error-title"
        th:text="${status == 404} ? 'Página no encontrada' :
                     (${status == 403} ? 'Acceso no autorizado' :
                     'Error interno del servidor')">Error</h1>

    <p class="error-desc"
       th:text="${status == 404} ? 'La página que buscas no existe o fue movida.' :
                    (${status == 403} ? 'No tienes permisos para acceder a esta sección.' :
                    'Ocurrió un error inesperado. Por favor intenta de nuevo.')">
        Error inesperado.
    </p>

    <div class="error-actions">
        <button onclick="history.back()" class="btn-outline">← Volver</button>
        <a href="/" class="btn-primary">Ir al inicio</a>
    </div>
</div>
</body>
</html>
